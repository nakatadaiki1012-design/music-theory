    --accent: #8cc5a6; --accent-ink: #18201c; --accent-soft: rgba(140, 197, 166, .2);
    --warm: #eda26b; --warm-soft: rgba(237, 162, 107, .2);
    --blue: #8fb5e8; --blue-soft: rgba(143, 181, 232, .2);
    --gold: #e3c15a; --gold-soft: rgba(227, 193, 90, .2); --ok: #8cc5a6; --ng: #eda26b;

}
:root[data-theme="dark"] {
  --bg: #18201c; --panel: #1f2924; --ink: #ebe8dd; --muted: #a3a89b; --line: #36443c; --chip: #28342e;

* { box-sizing: border-box; }

html, body { height: 100%; margin: 0; }

:root[data-theme="dark"] body[data-course="harm"] { --warm: #7fb0f0; --warm-soft: rgba(127, 176, 240, .2); } :root[data-theme="dark"] body[data-course="cp"] { --warm: #6fcf9f; --warm-soft: rgba(111, 207, 159, .2); }

  position: relative; border: 1.5px solid var(--ink); background: var(--panel); border-radius: 6px; padding: 10px 8px; min-height: 56px;
  font-size: calc(18px * var(--k)); font-weight: 700; line-height: 1.3; box-shadow: 2px 2px 0 var(--ink); display: flex; align-items: center; justify-content: center; gap: 6px;
}

.qz .ch button { padding-left: 18px; padding-right: 22px; }
.qz .ch button.lg { font-size: calc(15px * var(--k)); padding-left: 16px; }

.qz .ch button.ok { background: var(--accent-soft); border-color: var(--ok); box-shadow: 2px 2px 0 var(--ok); }
.qz .ch button.ng { background: var(--warm-soft); border-color: var(--ng); box-shadow: 2px 2px 0 var(--ng); }
.qz .ch button.ok::after, .qz .ch button.ng::after { position: absolute; right: 6px; top: 2px; font-size: 18px; }
.qz .ch button.ok::after { content: "○"; color: var(--ok); }
.qz .ch button.ng::after { content: "✕"; color: var(--ng); }
.qz .ch button:disabled { opacity: 1; cursor: default; }
.qz .ch button.dim { opacity: .45; }
.qz .fb { flex: none; display: flex; gap: 12px; align-items: center; border-top: 1px dashed var(--line); padding-top: 8px; }
.qz .fb .mk { font-family: var(--font-display); font-size: 30px; font-weight: 800; line-height: 1; flex: none; }
.qz .fb .mk.ok { color: var(--ok); }
.qz .fb .mk.ng { color: var(--ng); }
.qz .fb .ex { flex: 1; min-width: 0; font-size: calc(15px * var(--k)); line-height: 1.55; }
.qz .fb .ex b { color: var(--warm); }
.qz .fb .why { margin-top: 3px; font-size: .9em; color: var(--muted); }
.qz .fb .why b { color: inherit; }
.qz .fb .btn { flex: none; }
.res { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: center; }
.res .big { font-family: var(--font-display); font-size: calc(46px * var(--k)); font-weight: 800; line-height: 1.1; }
.res .big small { font-size: 22px; color: var(--muted); }
.res .msg { font-size: 17px; font-weight: 700; }
.res .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.res .stampbig { font-family: var(--font-display); color: var(--warm); border: 4px solid var(--warm); border-radius: 50%; width: 110px; height: 110px; display: grid; place-items: center; font-size: 30px; font-weight: 800; transform: rotate(-12deg); animation: stampin .5s cubic-bezier(.2, 1.6, .5, 1); }
@keyframes stampin { from { transform: rotate(-12deg) scale(2.4); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: 1; } }
.res .wrongs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 640px; }
.mbody .wrongs { display: flex; gap: 6px; flex-wrap: wrap; }
.mbody .wrongs span { border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; font-size: 13px; background: var(--bg); }
.res .wrongs span { border: 1px solid var(--line); border-radius: 3px; padding: 1px 8px; font-size: 13px; background: var(--bg); }

/* ===== 演習ハブ・ツール・ゲーム（左に一覧、右に中身） ===== */
.split { flex: 1; min-height: 0; display: grid; gap: 12px; grid-template-columns: 260px minmax(0, 1fr); }
.side { padding: 12px; display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow: hidden; }
.side h3 { font-family: var(--font-display); font-size: 15px; color: var(--muted); margin: 4px 4px 2px; letter-spacing: .06em; }
.side .it { text-align: left; border: 1px solid transparent; background: transparent; border-radius: 5px; padding: 6px 10px; display: flex; flex-direction: column; }
.side .it b { font-size: 14.5px; }
.side .it b i { font-style: normal; font-family: var(--font-en); color: var(--warm); margin-right: 6px; font-size: 13px; }
.side .it small { color: var(--muted); font-size: 12px; line-height: 1.35; }
.side .it[aria-current="true"] { border-color: var(--ink); background: var(--panel); box-shadow: 2px 2px 0 var(--ink); }
.side .it:hover { background: var(--chip); }
.main { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.mhead { flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.mbody { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 14px 16px; gap: 10px; overflow: hidden; }

.upick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.upick button { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 6px 9px; font-size: 13.5px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
.upick button i { font-style: normal; font-family: var(--font-en); color: var(--warm); font-size: 12px; }
.upick button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.upick button[aria-pressed="true"]::before { content: "✓"; color: var(--accent); }
.frow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.frow > span { font-size: 13px; color: var(--muted); min-width: 5em; }
.gcards { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.gcard { padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: hidden; }
.gcard h3 { font-family: var(--font-display); font-size: 22px; margin: 0; }
.gcard .in { border: 0; border-bottom: 2px solid var(--warm); background: var(--warm-soft); padding: 6px 10px; font-size: 18px; font-weight: 700; width: 100%; max-width: 220px; border-radius: 3px 3px 0 0; }
.lvbox { border: 1px solid var(--line); border-radius: 5px; padding: 10px 12px; background: var(--bg); display: flex; flex-direction: column; gap: 6px; }
.lvbox .lvname { font-family: var(--font-display); font-size: 24px; font-weight: 800; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); }
.bdg { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.bd { border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; display: flex; flex-direction: column; font-size: 12px; background: var(--panel); }
.bd span { font-size: 20px; }
.bd b { font-size: 12.5px; }
.bd small { color: var(--muted); font-size: 11px; line-height: 1.3; }
.bd.off { opacity: .45; filter: grayscale(1); }

/* タイムアタック */
.ta-top { flex: none; display: flex; gap: 12px; align-items: center; }
.ta-top .tbar { flex: 1; min-width: 80px; height: 14px; border-radius: 7px; background: var(--line); overflow: hidden; border: 1px solid var(--ink); }
.ta-top .tbar i { display: block; height: 100%; background: var(--accent); transition: width .1s linear, background-color .4s; will-change: width; }
.ta-top .tbar.low i { background: var(--warm); }
.ta-top .sc { flex: none; font-family: var(--font-en); font-size: 26px; font-weight: 600; width: 5.2em; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ta-top .sc small { font-size: 13px; color: var(--muted); font-family: var(--font-body); }
.ta-top .tm { font-family: var(--font-en); font-size: 20px; flex: none; width: 9.5em; text-align: left; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ta-top .tm small { color: var(--warm); font-size: 13px; margin-left: 4px; font-style: italic; }
.ta-top .cb { flex: none; font-weight: 800; color: var(--warm); width: 9.5em; white-space: nowrap; overflow: hidden; }
.ta-top .rank { font-weight: 800; border: 1.5px solid var(--ink); border-radius: 4px; padding: 0 8px; }
.pop { position: absolute; pointer-events: none; font-weight: 800; font-size: 22px; color: var(--accent); animation: popup .8s ease-out forwards; z-index: 5; }
.pop.ng { color: var(--ng); }
@keyframes popup { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-46px); opacity: 0; } }
.count { flex: 1; display: grid; place-items: center; font-family: var(--font-display); font-size: 120px; font-weight: 800; }
.flash-ok { animation: fok .35s; }
.flash-ng { animation: fng .35s; }
@keyframes fok { 0% { box-shadow: inset 0 0 0 4px var(--ok); } 100% { box-shadow: inset 0 0 0 0 var(--ok); } }
@keyframes fng { 0%, 50% { transform: translateX(-5px); } 25%, 75% { transform: translateX(5px); } 100% { transform: none; } }

/* ===== 🎮 ゲーム画面（夜のコンサートホール） ===== */
.arena { --ar-ink: #f6f1e4; --ar-dim: rgba(246, 241, 228, .62); color: var(--ar-ink); border: 0 !important; overflow: hidden;
  background: radial-gradient(ellipse 70% 55% at 50% -8%, rgba(255, 214, 140, .30), transparent 70%),
    radial-gradient(ellipse 90% 30% at 50% 108%, rgba(255, 190, 110, .22), transparent 70%),
    linear-gradient(180deg, #1b1838 0%, #241a3d 55%, #2b1b2c 100%) !important; }
.arena::before, .arena::after { content: ""; position: absolute; top: 0; bottom: 0; width: 26px; z-index: 0; pointer-events: none;
  background: repeating-linear-gradient(90deg, #7a1424 0 7px, #9b1d30 7px 12px, #6a1020 12px 16px); box-shadow: 0 0 18px rgba(0, 0, 0, .55); }
.arena::before { left: 0; border-radius: 0 0 18px 0; }
.arena::after { right: 0; border-radius: 0 0 0 18px; }
.arena > * { position: relative; z-index: 1; }
.arena { padding-left: 38px !important; padding-right: 38px !important; }
/* 上の HUD */
.arena .ta-top { background: rgba(10, 8, 26, .55); border: 1px solid rgba(255, 255, 255, .14); border-radius: 14px; padding: 6px 12px; box-shadow: 0 4px 14px rgba(0, 0, 0, .35); }
.arena .ta-top .tm { color: #fff; font-weight: 700; }
.arena .ta-top .tm::before { content: "⏱ "; font-size: .9em; }
.arena .ta-top .tm small { color: #ffb36b; }
.arena .ta-top .tbar { height: 18px; border-radius: 9px; border: 2px solid rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .10); position: relative; }
.arena .ta-top .tbar i { position: relative; background: linear-gradient(90deg, #2fd3a5, #7ef0b8); box-shadow: 0 0 12px rgba(80, 240, 180, .55); border-radius: 7px; }
.arena .ta-top .tbar i::after { content: ""; position: absolute; inset: 2px 6px auto 6px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .45); }
.arena .ta-top .tbar.low i { background: linear-gradient(90deg, #ff5e3a, #ffb14a); box-shadow: 0 0 14px rgba(255, 110, 60, .75); }
.arena .ta-top .tbar.low { animation: lowglow 1.6s ease-in-out infinite; }
@keyframes lowglow { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 110, 60, 0); } 50% { box-shadow: 0 0 14px 2px rgba(255, 110, 60, .45); } }
.arena .ta-top .sc { color: #ffd76a; text-shadow: 0 2px 0 rgba(0, 0, 0, .4); }
.arena .ta-top .sc small { color: var(--ar-dim); }
.arena .ta-top .sc.bump { animation: scbump .35s ease-out; }
@keyframes scbump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
.arena .ta-top .cb { color: #ffb36b; }
.arena .ta-top .cb b { display: inline-block; font-family: var(--font-en); font-size: 1.25em; color: #fff; }
.arena .ta-top .cb.hot b { color: #ffd76a; text-shadow: 0 0 10px rgba(255, 180, 60, .8); }
.arena .ta-top .cb.bump b { animation: scbump .3s ease-out; }
.arena .ta-top .rank { border-color: #ffd76a; color: #ffd76a; }
/* ステージの帯 */
.arena .stagebar { background: rgba(10, 8, 26, .45); border-color: rgba(255, 255, 255, .14); color: var(--ar-ink); }
.arena .stagebar .sa { background: rgba(255, 255, 255, .14); }
.arena .stagebar .sa i { background: linear-gradient(90deg, #ffb14a, #ffd76a); box-shadow: 0 0 8px rgba(255, 210, 110, .7); }
.arena .stagebar .sn { color: var(--ar-dim); }
.arena .stagebar.ff { background: linear-gradient(90deg, rgba(255, 180, 60, .35), rgba(255, 90, 90, .35), rgba(255, 180, 60, .35)); background-size: 200% 100%; border-color: #ffd76a; }
/* 問題カード：楽譜が 読みやすいように 白い 紙 */
.arena #gq > .qz { background: var(--panel); color: var(--ink); border-radius: 16px; margin-top: 8px; padding: 10px 14px 12px !important; box-shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 0 0 3px rgba(255, 215, 120, .25); }
.arena #gq > .qz.flash-ok { animation: aok .45s ease-out; }
.arena #gq > .qz.flash-ng { animation: fng .35s; }
@keyframes aok { 0% { box-shadow: 0 0 0 0 rgba(47, 211, 165, .9), 0 10px 30px rgba(0, 0, 0, .45); } 100% { box-shadow: 0 0 0 18px rgba(47, 211, 165, 0), 0 10px 30px rgba(0, 0, 0, .45); } }
/* 答えのボタン：4 色 ＋ 音符マーク */
.arena .qz .ch button { border: 0; color: #fff; border-radius: 12px; min-height: 58px; text-shadow: 0 1px 0 rgba(0, 0, 0, .25); box-shadow: 0 5px 0 rgba(0, 0, 0, .28); transition: transform .08s, box-shadow .08s; }
.arena .qz .ch button:nth-child(1) { background: linear-gradient(180deg, #3aa0e8, #2779c7); }
.arena .qz .ch button:nth-child(2) { background: linear-gradient(180deg, #f2795a, #d9553c); }
.arena .qz .ch button:nth-child(3) { background: linear-gradient(180deg, #f4b53c, #d9921c); }
.arena .qz .ch button:nth-child(4) { background: linear-gradient(180deg, #9a6be0, #7646c2); }
.arena .qz .ch button:hover:not(:disabled) { filter: brightness(1.08); }
.arena .qz .ch button:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0, 0, 0, .28); }
.arena .qz .ch button .kn { color: rgba(255, 255, 255, .85); font-size: 13px; font-family: var(--font-sym); }
.arena .qz .ch button:nth-child(1) .kn::before { content: "♩ "; } .arena .qz .ch button:nth-child(2) .kn::before { content: "♪ "; }
.arena .qz .ch button:nth-child(3) .kn::before { content: "♫ "; } .arena .qz .ch button:nth-child(4) .kn::before { content: "♬ "; }
.arena .qz .ch button.fg { background: #fff !important; color: var(--ink); box-shadow: 0 5px 0 rgba(0, 0, 0, .18), inset 0 0 0 3px #3aa0e8; }
.arena .qz .ch button.fg:nth-child(2) { box-shadow: 0 5px 0 rgba(0, 0, 0, .18), inset 0 0 0 3px #f2795a; }
.arena .qz .ch button.fg:nth-child(3) { box-shadow: 0 5px 0 rgba(0, 0, 0, .18), inset 0 0 0 3px #f4b53c; }
.arena .qz .ch button.fg:nth-child(4) { box-shadow: 0 5px 0 rgba(0, 0, 0, .18), inset 0 0 0 3px #9a6be0; }
.arena .qz .ch button.fg .kn { color: var(--muted); }
.arena .qz .ch button.ok { background: linear-gradient(180deg, #34d39e, #1fa877) !important; color: #fff; box-shadow: 0 0 0 4px rgba(52, 211, 158, .45), 0 5px 0 rgba(0, 0, 0, .28); transform: scale(1.04); }
.arena .qz .ch button.ng { background: linear-gradient(180deg, #8a8a96, #6a6a76) !important; color: #fff; }
.arena .qz .ch button.dim { opacity: .35; }
.arena .qz .ch button.ok::after, .arena .qz .ch button.ng::after { color: #fff; }
/* はんてい（ナイス！・ブラボー！） */
.judge { position: absolute; left: 50%; top: 46%; z-index: 9; pointer-events: none; text-align: center; transform: translate(-50%, -50%); animation: judgein .9s ease-out forwards; white-space: nowrap; }
.judge b { display: block; font-family: var(--font-display); font-size: 54px; font-weight: 900; letter-spacing: .02em; color: #ffd76a;
  text-shadow: 0 0 2px #4a2a00, 0 2px 0 #4a2a00, 0 4px 0 #4a2a00, 2px 2px 0 #4a2a00, -2px 2px 0 #4a2a00, 0 0 26px rgba(255, 200, 80, .9); }
.judge small { display: inline-block; margin-top: 2px; font-size: 18px; font-weight: 800; color: #fff; background: rgba(10, 8, 26, .75); border-radius: 999px; padding: 2px 12px; }
.judge.lv2 b { color: #7ef0b8; text-shadow: 0 0 2px #0b3d2c, 0 2px 0 #0b3d2c, 0 4px 0 #0b3d2c, 2px 2px 0 #0b3d2c, -2px 2px 0 #0b3d2c, 0 0 26px rgba(80, 240, 180, .9); }
.judge.lv3 b { color: #ff9ad5; text-shadow: 0 0 2px #4a0b33, 0 2px 0 #4a0b33, 0 4px 0 #4a0b33, 2px 2px 0 #4a0b33, -2px 2px 0 #4a0b33, 0 0 30px rgba(255, 120, 200, .95); font-size: 60px; }
.judge.ng b { color: #dcdce6; text-shadow: 0 0 2px #2a2a36, 0 2px 0 #2a2a36, 0 4px 0 #2a2a36, 2px 2px 0 #2a2a36, -2px 2px 0 #2a2a36; font-size: 44px; }
@keyframes judgein { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4) rotate(-6deg); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.12) rotate(-3deg); } 35% { transform: translate(-50%, -50%) scale(1) rotate(-3deg); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -62%) scale(1) rotate(-3deg); } }
/* 結果（カーテンコール） */
.res.arena .note, .res.arena p { color: var(--ar-ink); }
.res.arena .big { color: #ffd76a; font-size: calc(64px * var(--k)); text-shadow: 0 4px 0 #4a2a00, 0 0 30px rgba(255, 200, 80, .6); font-variant-numeric: tabular-nums; }
.res.arena .big small { color: var(--ar-dim); }
.res.arena .curtain { background: rgba(255, 215, 120, .14); border-color: #ffd76a; color: var(--ar-ink); }
.res.arena .curtain small { color: var(--ar-dim); }
.res.arena .msg { color: #fff; }
.res.arena .btn:not(.main) { background: rgba(255, 255, 255, .94); color: var(--ink); }
.res.arena .btn.ghost { background: transparent; color: var(--ar-ink); border-color: rgba(255, 255, 255, .5); }
/* カウントダウン */
.arena .count { color: #ffd76a; text-shadow: 0 6px 0 #4a2a00, 3px 3px 0 #4a2a00, -3px 3px 0 #4a2a00, 0 0 40px rgba(255, 200, 80, .7); }
.arena .count span { display: inline-block; animation: cdin .9s ease-out; }
@keyframes cdin { 0% { opacity: 0; transform: scale(2.2); } 30% { opacity: 1; transform: scale(.92); } 45% { transform: scale(1); } 100% { opacity: 1; } }
.arena .count small { display: block; font-size: 22px; text-shadow: none; color: var(--ar-dim); text-align: center; font-family: var(--font-body); }
.arena .gbanner { top: 224px; color: var(--ink); }
.arena .gbanner.venue { animation-duration: 2.3s; }
@media (max-width: 640px) { .arena .gbanner { top: 196px; } }
@media (max-width: 640px) {
  .arena { padding-left: 16px !important; padding-right: 16px !important; }
  .arena::before, .arena::after { width: 9px; }
  .arena #gq > .qz { padding: 8px 10px 10px !important; border-radius: 12px; }
  .judge b { font-size: 40px; } .judge.lv3 b { font-size: 44px; } .judge.ng b { font-size: 34px; } .judge small { font-size: 15px; }
  .arena .ta-top .tbar { height: 14px; }
}

/* せまい画面：1 段目に 時間・コンボ・点数、2 段目に ゲージ（段数が 変わらないので 画面が ゆれない） */
@media (max-width: 900px) {
  .ta-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; column-gap: 8px; row-gap: 5px; }
  .ta-top .tm, .ta-top .cb, .ta-top .sc { width: auto; }
  .ta-top .cb { text-align: center; text-overflow: ellipsis; }
  .ta-top .tbar { grid-column: 1 / -1; grid-row: 2; min-width: 0; }
}

/* ===== 🚂 音楽史タイムトラベル列車 ===== */
.trn { flex: none; position: relative; height: 140px; margin-top: 8px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255, 255, 255, .18); box-shadow: 0 6px 18px rgba(0, 0, 0, .35); isolation: isolate; }
.trn .sky, .trn .far, .trn .near, .trn .rail { position: absolute; left: 0; right: 0; }
.trn .sky { inset: 0; transition: opacity 1.4s ease; }
.trn .sky.b, .trn .far.b { opacity: 0; }
.trn .far { bottom: 22px; height: 90px; background-repeat: repeat-x; background-size: 480px 90px; transition: opacity 1.4s ease; }
.trn .near { bottom: 16px; height: 90px; background-repeat: repeat-x; background-size: 480px 90px; }
.trn .rail { bottom: 0; height: 22px; background: repeating-linear-gradient(90deg, #5b3b26 0 6px, transparent 6px 22px) 0 4px / 22px 7px repeat-x, linear-gradient(#7d7d8c, #7d7d8c) 0 3px / 100% 3px no-repeat, #3b3046; }

/* クラス対戦（先生） */
.host { flex: 1; min-height: 0; display: grid; gap: 12px; grid-template-columns: 290px minmax(0, 1fr); }

.qr { width: 100%; max-width: 190px; margin: 0 auto; aspect-ratio: 1; background: #fff; border-radius: 4px; padding: 4px; }
.qr svg { width: 100%; height: 100%; display: block; }

.board .bhead .tm { margin-left: auto; font-family: var(--font-en); font-size: 34px; font-weight: 600; }
.board .tabs { display: flex; gap: 4px; }
.bbody { flex: 1; min-height: 0; display: grid; gap: 4px 12px; align-content: start; overflow: hidden; }
.prow { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 4px; padding: 3px 10px; background: var(--panel); font-weight: 700; }

.names { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
.names span { border: 1px solid var(--ink); border-radius: 4px; padding: 3px 10px; font-weight: 700; background: var(--panel); animation: stampin .4s; }
.podium { position: absolute; inset: 0; background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 6; }

/* アンサンブル・クイズ（先生の画面） */
.board.ens { gap: 8px; }

.ebarw { flex: none; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }

@media (max-width: 900px) {

/* ゲームの演出（ステージ） */
.stagebar { flex: none; display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line);
  background: linear-gradient(180deg, var(--chip), var(--panel)); font-size: 13.5px; font-weight: 700; position: relative; overflow: hidden; transition: background .6s; }
.stagebar::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s;
  background: radial-gradient(ellipse 40% 140% at 50% -40%, rgba(255, 230, 150, .55), transparent 70%); }
.stagebar[data-v="2"]::before, .stagebar[data-v="3"]::before { opacity: .5; }
.stagebar[data-v="4"]::before, .stagebar[data-v="5"]::before, .stagebar[data-v="6"]::before, .stagebar[data-v="7"]::before { opacity: 1; }
.stagebar[data-v="4"], .stagebar[data-v="5"] { border-color: var(--gold); }
.stagebar[data-v="6"], .stagebar[data-v="7"] { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.stagebar > * { position: relative; }
.stagebar .sv { white-space: nowrap; }
.stagebar .sb { font-size: 18px; letter-spacing: 1px; white-space: nowrap; }
.stagebar .sa { flex: 1; min-width: 40px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.stagebar .sa i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .4s; }
.stagebar .sn { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
.stagebar.ff { background: linear-gradient(90deg, var(--gold-soft), var(--warm-soft), var(--gold-soft)); background-size: 200% 100%; animation: ffbg 1.2s linear infinite; border-color: var(--warm); }
@keyframes ffbg { to { background-position: 200% 0; } }
.gbanner { position: absolute; left: 50%; top: 128px; transform: translateX(-50%); z-index: 7; background: var(--panel); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 16px; font-weight: 800; white-space: nowrap; box-shadow: 2px 2px 0 var(--ink); animation: bannerin 1.6s ease-out forwards; pointer-events: none; }
.gbanner.ffb { border-color: var(--warm); color: var(--warm); box-shadow: 2px 2px 0 var(--warm); }
.gbanner.ffb .en { font-style: italic; font-size: 1.3em; }
.gbanner.venue { border-color: var(--gold); box-shadow: 2px 2px 0 var(--gold); }
@keyframes bannerin { 0% { opacity: 0; transform: translate(-50%, 8px) scale(.9); } 12%, 75% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -10px); } }
.fnote { position: fixed; z-index: 65; pointer-events: none; font-family: var(--font-sym); font-size: 24px; color: var(--accent); animation: noteup 1.3s ease-out forwards; }
.fnote.gold { color: var(--gold); font-size: 28px; }
@keyframes noteup { from { opacity: 1; transform: translate(0, 0) rotate(0); } to { opacity: 0; transform: translate(var(--dx), -110px) rotate(-20deg); } }
.curtain { display: flex; align-items: center; gap: 12px; text-align: left; border: 1.5px solid var(--gold); border-radius: 8px; padding: 8px 14px; background: var(--gold-soft); }
.curtain .cv { font-size: 40px; line-height: 1; }
.curtain small { color: var(--muted); }
.estrip.gain .emel { animation: gainp 1.4s ease-out; border-radius: 6px; }
@keyframes gainp { 0% { box-shadow: 0 0 0 0 var(--accent); } 30% { box-shadow: 0 0 0 6px var(--accent-soft); } 100% { box-shadow: 0 0 0 0 transparent; } }
.tempopop { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 8; font-size: 46px; font-weight: 600; font-style: italic; color: var(--warm); pointer-events: none; animation: tempoin 1.6s ease-out forwards; }
@keyframes tempoin { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.5) rotate(-8deg); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(-4deg); } 70% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-4deg); } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1); } }
@media (max-width: 640px) { .stagebar .sn { display: none; } .gbanner { top: 120px; font-size: 13px; } }

/* ダイアログ */
dialog { border: 1.5px solid var(--ink); border-radius: 8px; background: var(--panel); color: var(--ink); padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); box-shadow: 4px 4px 0 var(--ink); }

.dlg { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100dvh - 30px); overflow: auto; }
.dlg h3 { font-family: var(--font-display); font-size: 20px; margin: 0; display: flex; align-items: center; }

.celebrate { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 60; background: var(--panel); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); border-radius: 10px; padding: 18px 28px; text-align: center; animation: celin .45s cubic-bezier(.2, 1.6, .5, 1); pointer-events: none; }

@keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }

/* ツール */

.toolw .ctl { flex: none; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
